<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>晨雾草甸 · 一日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --glass:rgba(18,24,22,.32);
    --glass-strong:rgba(10,13,12,.62);
    --glass-border:rgba(243,241,234,.16);
    --accent:#d4e8d0; --accent-rgb:212,232,208;
    --ui:#f3f1ea; --muted:rgba(243,241,234,.58);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
    --tint:rgba(212,232,208,0); --dim:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;color:var(--ui);font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  .serif{font-family:"Cormorant Garamond","Songti SC",serif;}

  #stage{position:fixed;inset:0;width:100%;height:100dvh;background:#000;z-index:0;overflow:hidden}
  #v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 120% at 50% 40%,transparent 48%,rgba(0,0,0,.55) 100%);}
  #grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
  #tint{position:fixed;inset:0;z-index:4;pointer-events:none;background:var(--tint);transition:background 1.2s ease;}
  #dim{position:fixed;inset:0;z-index:5;pointer-events:none;background:#000;opacity:var(--dim);transition:opacity 1.2s ease;}
  #cg{position:fixed;top:0;left:0;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;pointer-events:none;z-index:6;opacity:0;
    background:radial-gradient(circle,rgba(var(--accent-rgb),.12),transparent 70%);mix-blend-mode:screen;transition:opacity .4s ease;}

  #top{position:fixed;top:max(14px,var(--safe-t));left:max(16px,var(--safe-l));right:max(16px,var(--safe-r));z-index:7;display:flex;justify-content:space-between;align-items:flex-start;transition:opacity .6s ease;}
  #titlebox{pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.7)}
  #titlebox .t{font-size:28px;letter-spacing:.1em;font-weight:600;line-height:1.05}
  #titlebox .s{font-size:11px;letter-spacing:.36em;color:var(--muted);margin-top:5px;text-transform:uppercase}
  #titlebox .clock{font-size:14px;color:var(--accent);margin-top:10px;letter-spacing:.16em;font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.85)}
  .btns{display:flex;gap:10px}
  .ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--ui);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 8px 24px -10px rgba(0,0,0,.55);
    transition:transform .15s,box-shadow .3s}
  .ic:active{transform:scale(.92)}
  .ic:hover{box-shadow:0 0 0 1px var(--accent),0 0 22px -2px rgba(var(--accent-rgb),.6)}
  .ic.active{box-shadow:0 0 0 1px var(--accent),0 0 26px -2px rgba(var(--accent-rgb),.8)}

  #dock{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:12px max(16px,var(--safe-l)) calc(12px + var(--safe-b)) max(16px,var(--safe-r));
    display:flex;flex-direction:column;gap:10px;background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,0));transition:opacity .6s ease;}
  #timeline{display:flex;flex-direction:column;gap:5px}
  #track{position:relative;height:28px;border-radius:14px;overflow:hidden;border:1px solid var(--glass-border);background:rgba(0,0,0,.28);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);touch-action:none;cursor:pointer}
  #track-inner{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:14px}
  .seg{position:relative;height:100%;opacity:.9}
  .seg.dawn{background:linear-gradient(180deg,#ffb07c55,#ff8a5b33)}
  .seg.day{background:linear-gradient(180deg,#e8f4ff33,#ffffff18)}
  .seg.dusk{background:linear-gradient(180deg,#ffaa3333,#ff552233)}
  .seg.night{background:linear-gradient(180deg,#1a2a5a55,#0a0a1a66)}
  #indicator{position:absolute;top:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:var(--accent);
    box-shadow:0 0 12px 2px rgba(255,255,255,.6),0 0 0 2px rgba(0,0,0,.4);transform:translate(-50%,-50%);left:0;top:50%;pointer-events:none;z-index:3}
  #tl-label{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}

  #ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .demo{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:30px;border:1px solid var(--glass-border);background:var(--glass);
    color:var(--ui);font-size:13px;letter-spacing:.1em;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 6px 18px -10px rgba(0,0,0,.6);white-space:nowrap}
  .demo.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px -3px rgba(var(--accent-rgb),.7)}
  .demo:active{transform:scale(.96)}
  .vol{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
  .vol input[type=range]{width:110px;accent-color:var(--accent);height:22px}

  #gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(0,0,0,.28);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:opacity .9s ease;text-align:center;padding:24px}
  #gate .card{max-width:400px;width:100%;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:26px;padding:34px 28px;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.72);position:relative;overflow:hidden}
  #gate .card::before{content:"";position:absolute;inset:-2px;z-index:-1;border-radius:28px;background:linear-gradient(120deg,rgba(var(--accent-rgb),.5),rgba(var(--accent-rgb),.08));filter:blur(16px);opacity:.5;animation:pulse 4s ease-in-out infinite}
  #gate h1{font-size:34px;letter-spacing:.18em;font-weight:600}
  #gate .en{font-size:12px;letter-spacing:.42em;color:var(--muted);margin-top:8px;text-transform:uppercase}
  #gate p{font-size:13px;color:var(--muted);letter-spacing:.05em;line-height:1.9;margin-top:18px}
  #gate .go{margin-top:24px;display:inline-block;padding:13px 36px;border-radius:40px;border:1px solid var(--glass-border);background:rgba(255,255,255,.05);
    font-size:14px;letter-spacing:.24em;cursor:pointer;color:var(--ui);transition:transform .15s,box-shadow .3s}
  #gate .go:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--accent),0 0 30px -4px rgba(var(--accent-rgb),.8)}
  #gate .go:active{transform:scale(.96)}

  #credits{position:fixed;inset:0;z-index:30;background:rgba(6,8,7,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:none;flex-direction:column;padding:max(30px,var(--safe-t)) 22px max(30px,var(--safe-b));overflow:auto}
  #credits.show{display:flex;animation:fade .3s ease}
  #credits h2{font-size:18px;letter-spacing:.16em;margin-bottom:20px}
  #credits .row{margin-bottom:16px;border-left:2px solid var(--accent);padding-left:13px}
  #credits .row b{font-size:14px;letter-spacing:.08em}
  #credits .row div{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.75}
  #credits .close{margin-top:auto;align-self:flex-end;padding:11px 28px;border-radius:30px;border:1px solid var(--glass-border);background:transparent;color:var(--ui);font-size:13px;cursor:pointer;letter-spacing:.16em}

  .hidden{opacity:0!important;pointer-events:none!important}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.85}}
</style>
</head>
<body>

  <div id="stage">
    <video id="v" muted loop playsinline preload="auto" autoplay poster="./media/forest.jpg"></video>
  </div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="tint"></div>
  <div id="dim"></div>
  <div id="cg"></div>

  <div id="top">
    <div id="titlebox">
      <div class="t serif">晨雾草甸</div>
      <div class="s">MISTY MEADOW</div>
      <div class="clock" id="clock">--:-- · --</div>
    </div>
    <div class="btns">
      <div class="ic" id="btn-sound" title="声音">🔊</div>
      <div class="ic" id="btn-info" title="素材来源">ⓘ</div>
    </div>
  </div>

  <div id="dock">
    <div id="timeline">
      <div id="track">
        <div id="track-inner">
          <div class="seg dawn" style="width:16.67%" title="黎明 0-6"></div>
          <div class="seg day" style="width:41.67%" title="白昼 6-16"></div>
          <div class="seg dusk" style="width:16.67%" title="黄昏 16-20"></div>
          <div class="seg night" style="width:25%" title="深夜 20-24"></div>
        </div>
        <div id="indicator"></div>
      </div>
      <div id="tl-label"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    </div>
    <div id="ctrl">
      <div class="demo" id="btn-demo">▶ 时光流转</div>
      <div class="vol"><span id="vol-icon">🔈</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.85"/></div>
    </div>
  </div>

  <div id="gate">
    <div class="card">
      <h1 class="serif">晨雾草甸</h1>
      <div class="en">A Day in the Misty Meadow</div>
      <p>同一片真实草甸 · 随 24 小时光影流转<br/>戴上耳机，轻触开启</p>
      <div class="go" id="gate-go">轻触开启</div>
    </div>
  </div>

  <div id="credits">
    <h2>素材来源 / 授权（自我审核）</h2>
    <div id="credits-body"></div>
    <button class="close" id="credits-close">关闭</button>
  </div>

<script>
"use strict";
const SCENES_URL = "./scenes.json";
const DEMO_SECONDS = 120;
let scene = null;
let vh = 0, mode = "real", lastT = performance.now();
let unlocked = false, muted = false, uiTimer = null, dragging = false;
let volume = 0.85;

// ---------- 24h 光影关键帧 ----------
const GRADE = [
  {h:0,  tint:[26,38,90],   op:.55, dim:.58},
  {h:4,  tint:[26,38,90],   op:.50, dim:.50},
  {h:5,  tint:[255,140,100],op:.38, dim:.32},
  {h:7,  tint:[255,200,130],op:.18, dim:.08},
  {h:9,  tint:[220,240,255],op:.08, dim:.00},
  {h:15, tint:[220,240,255],op:.05, dim:.00},
  {h:17, tint:[255,170,50], op:.28, dim:.08},
  {h:19, tint:[255,100,60], op:.35, dim:.22},
  {h:21, tint:[80,60,140],  op:.32, dim:.42},
  {h:23, tint:[26,38,90],   op:.48, dim:.55},
  {h:24, tint:[26,38,90],   op:.55, dim:.58}
];
function lerp(a,b,t){return a+(b-a)*t;}
function gradeAt(h){
  for(let i=0;i<GRADE.length-1;i++){
    const a=GRADE[i], b=GRADE[i+1];
    if(h>=a.h && h<=b.h){
      const t=(h-a.h)/(b.h-a.h);
      return {
        tint:`rgba(${Math.round(lerp(a.tint[0],b.tint[0],t))},${Math.round(lerp(a.tint[1],b.tint[1],t))},${Math.round(lerp(a.tint[2],b.tint[2],t))},${lerp(a.op,b.op,t).toFixed(3)})`,
        dim:lerp(a.dim,b.dim,t).toFixed(3)
      };
    }
  }
  return {tint:"rgba(26,38,90,.55)",dim:".58"};
}
function setGrade(h){
  const g=gradeAt(h);
  document.documentElement.style.setProperty("--tint",g.tint);
  document.documentElement.style.setProperty("--dim",g.dim);
}

// ---------- 音频引擎 ----------
const Audio = {
  ctx:null, master:null, nodes:new Map(),
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = volume;
    this.master.connect(this.ctx.destination);
  },
  get(url){
    if(this.nodes.has(url)) return this.nodes.get(url);
    const el = document.createElement("audio");
    el.src = url; el.loop = true; el.preload = "auto"; el.crossOrigin = "anonymous";
    const src = this.ctx.createMediaElementSource(el);
    const g = this.ctx.createGain(); g.gain.value = 0;
    src.connect(g); g.connect(this.master);
    const node = {el, gain:g};
    this.nodes.set(url, node);
    return node;
  },
  targets(h){
    // wind 始终低吟
    const wind = 0.22;
    // day 音乐：白天 peak
    let day = 0;
    if(h>=5 && h<17) day = Math.min(1, Math.max(0, 1 - Math.min(Math.abs(h-11)/6, 1)));
    else if(h>=17 && h<19) day = Math.max(0, 1-(h-17)/2);
    else if(h>=4 && h<5) day = (h-4);
    // night 音乐：夜间 peak
    let night = 0;
    if(h>=19 || h<5){
      const center = h>=19 ? (h<=23?21:23.5) : 1;
      night = Math.max(0, 1 - Math.abs(h-center)/4);
    }
    if(h>=17 && h<19) night = (h-17)/2;
    return {wind, day:day*.55, night:night*.55};
  },
  apply(h){
    if(!this.ctx || !scene) return;
    const t = this.targets(h);
    const map = scene.audio;
    if(map.wind) this.fade(map.wind, t.wind);
    if(map.day) this.fade(map.day, t.day);
    if(map.night) this.fade(map.night, t.night);
  },
  fade(url, to){
    const node = this.get(url);
    node.gain.gain.setTargetAtTime(muted?0:to, this.ctx.currentTime, 0.8);
    if(to>0.01 && node.el.paused) node.el.play().catch(()=>{});
  },
  setMuted(m){
    muted = m;
    if(this.ctx) this.master.gain.setTargetAtTime(m?0:volume, this.ctx.currentTime, 0.3);
  },
  setVolume(v){
    volume = v;
    if(this.ctx && !muted) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.2);
  }
};

// ---------- 视频自动播放 ----------
function startVideo(){
  const v = document.getElementById("v");
  v.muted = true;
  const p = v.play();
  if(p && p.then){
    p.catch(()=>{
      const retry = ()=>{ v.play().catch(()=>{}); };
      window.addEventListener("pointerdown", retry, {once:true});
    });
  }
}

// ---------- 时间逻辑 ----------
function realHour(){ const d=new Date(); return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600; }
function periodLabel(h){
  if(h>=5 && h<7) return "黎明";
  if(h>=7 && h<11) return "上午";
  if(h>=11 && h<13) return "正午";
  if(h>=13 && h<17) return "午后";
  if(h>=17 && h<19) return "黄昏";
  if(h>=19 && h<21) return "傍晚";
  return "深夜";
}
function fmtClock(h){
  const hh=Math.floor(h)%24, mm=Math.floor((h-Math.floor(h))*60);
  return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+" · "+periodLabel(h);
}
function setHour(h){
  vh = ((h%24)+24)%24;
  document.getElementById("clock").textContent = fmtClock(vh);
  document.getElementById("indicator").style.left = (vh/24*100)+"%";
  setGrade(vh);
  if(unlocked) Audio.apply(vh);
}

// ---------- 时间轴拖动 ----------
function hourFromX(clientX){
  const r = document.getElementById("track").getBoundingClientRect();
  let x = (clientX - r.left) / r.width;
  return Math.max(0, Math.min(1, x)) * 24;
}
function initDrag(){
  const track = document.getElementById("track");
  track.addEventListener("pointerdown", e=>{
    dragging = true; mode = "real"; updateDemoBtn();
    track.setPointerCapture(e.pointerId);
    setHour(hourFromX(e.clientX)); poke();
  });
  track.addEventListener("pointermove", e=>{ if(dragging) setHour(hourFromX(e.clientX)); });
  const end = ()=>{ dragging = false; };
  track.addEventListener("pointerup", end);
  track.addEventListener("pointercancel", end);
}

// ---------- 时光流转 ----------
function updateDemoBtn(){
  const b = document.getElementById("btn-demo");
  b.classList.toggle("active", mode === "demo");
  b.textContent = mode === "demo" ? "⏸ 暂停流转" : "▶ 时光流转";
}
function toggleDemo(){
  mode = mode === "demo" ? "real" : "demo";
  if(mode === "real") setHour(realHour());
  updateDemoBtn(); poke();
}

// ---------- 主循环 ----------
function loop(now){
  const dt = (now - lastT) / 1000; lastT = now;
  if(mode === "demo"){
    setHour(vh + dt * (24 / DEMO_SECONDS));
  } else if(!dragging){
    const rh = realHour();
    if(Math.abs(rh - vh) > 0.02) setHour(rh);
  }
  requestAnimationFrame(loop);
}

// ---------- 解锁与 UI ----------
function unlock(){
  if(unlocked) return;
  unlocked = true;
  Audio.ensure();
  Audio.ctx.resume();
  if(scene) Audio.apply(vh);
  const gate = document.getElementById("gate");
  gate.classList.add("hidden");
  setTimeout(()=>gate.style.display="none", 900);
}
function poke(){
  document.getElementById("top").classList.remove("hidden");
  document.getElementById("dock").classList.remove("hidden");
  clearTimeout(uiTimer);
  uiTimer = setTimeout(()=>{
    if(!document.getElementById("credits").classList.contains("show")){
      document.getElementById("top").classList.add("hidden");
      document.getElementById("dock").classList.add("hidden");
    }
  }, 4200);
}
function buildCredits(){
  if(!scene) return;
  document.getElementById("credits-body").innerHTML = `
    <div class="row"><b>${scene.title} · ${scene.subtitle}</b>
      <div>视频：${scene.credit.video}</div>
      <div>音频：${scene.credit.audio}</div>
    </div>
    <div class="row"><b>说明</b>
      <div>视频来自 Pixabay（Pixabay License：免费、可商用、无需署名）。环境音来自开源项目 adams914/beach-wallpaper（免费可复用）。本页仅做沉浸式播放，未改动原始素材内容。</div>
    </div>`;
}
function initCursorGlow(){
  if(!matchMedia("(pointer:fine)").matches) return;
  const cg = document.getElementById("cg");
  window.addEventListener("pointermove", e=>{
    cg.style.transform = "translate("+e.clientX+"px,"+e.clientY+"px)";
    cg.style.opacity = 1;
  },{passive:true});
  window.addEventListener("pointerleave", ()=>{ cg.style.opacity = 0; });
}

// ---------- 启动 ----------
fetch(SCENES_URL).then(r=>r.json()).then(data=>{
  scene = data[0];
  const v = document.getElementById("v");
  v.poster = scene.poster;
  v.src = scene.video;
  startVideo();
  buildCredits();
  initDrag();
  setHour(realHour());
  updateDemoBtn();
  initCursorGlow();
  poke();
  requestAnimationFrame(loop);
  // 4 秒后自动淡出开场遮罩
  setTimeout(()=>{
    const g = document.getElementById("gate");
    if(!g.classList.contains("hidden")){ g.classList.add("hidden"); setTimeout(()=>g.style.display="none", 900); }
  }, 4000);
}).catch(e=>{ console.error(e); });

document.getElementById("gate-go").addEventListener("click", unlock);
document.getElementById("stage").addEventListener("click", ()=>{ if(!unlocked) unlock(); else poke(); });
document.getElementById("btn-sound").addEventListener("click", e=>{
  e.stopPropagation(); poke();
  muted = !muted;
  const b = document.getElementById("btn-sound");
  b.textContent = muted ? "🔇" : "🔊";
  b.classList.toggle("active", !muted);
  Audio.setMuted(muted);
});
document.getElementById("btn-info").addEventListener("click", e=>{
  e.stopPropagation(); poke();
  document.getElementById("credits").classList.add("show");
});
document.getElementById("credits-close").addEventListener("click", e=>{
  e.stopPropagation();
  document.getElementById("credits").classList.remove("show");
});
document.getElementById("btn-demo").addEventListener("click", e=>{
  e.stopPropagation(); poke(); toggleDemo();
});
document.getElementById("vol").addEventListener("input", e=>{
  poke();
  const v = parseFloat(e.target.value);
  Audio.setVolume(v);
  document.getElementById("vol-icon").textContent = v === 0 ? "🔇" : (v < 0.45 ? "🔈" : "🔊");
});
["pointermove","touchstart","keydown"].forEach(ev=>window.addEventListener(ev, poke, {passive:true}));
window.addEventListener("orientationchange", ()=>setTimeout(()=>window.scrollTo(0,0), 200));
