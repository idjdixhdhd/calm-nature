<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>静谧自然 · Quiet Nature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --glass:rgba(18,24,22,.38);
    --glass-strong:rgba(12,16,15,.74);
    --glass-border:rgba(159,211,199,.20);
    --shadow:0 24px 60px -20px rgba(0,0,0,.72);
    --radius:18px;
    --accent:#9fd3c7; --accent-rgb:159,211,199; --mote:159,211,199;
    --ui:#f3f1ea; --muted:rgba(243,241,234,.62);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  [data-mood="ember"]{
    --accent:#ffb877; --accent-rgb:255,184,119; --mote:255,184,119;
    --glass-border:rgba(255,184,119,.22);
  }
  [data-mood="night"]{
    --accent:#a9b8ff; --accent-rgb:169,184,255; --mote:150,170,255;
    --glass-border:rgba(169,184,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;color:var(--ui);
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .serif{font-family:"Cormorant Garamond","Songti SC",serif;}

  #stage{position:fixed;inset:0;width:100%;height:100dvh;background:#000;z-index:0}
  .vid{position:absolute;inset:0;width:100%;height:100%;height:100dvh;object-fit:cover;opacity:0;
    transition:opacity 1.1s ease;will-change:opacity;}
  .vid.on{opacity:1}
  #bgCanvas{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.9}
  #vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 42%,transparent 52%,rgba(0,0,0,.6) 100%);}
  #scrim{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 20%,transparent 64%,rgba(0,0,0,.66));}
  #cg{position:fixed;top:0;left:0;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;
    background:radial-gradient(circle,rgba(var(--accent-rgb),.14),transparent 70%);
    pointer-events:none;z-index:5;mix-blend-mode:screen;opacity:0;transition:opacity .5s ease;}

  /* 顶部信息条 */
  #top{position:fixed;top:max(14px,var(--safe-t));left:max(16px,var(--safe-l));right:max(16px,var(--safe-r));
    z-index:6;display:flex;justify-content:space-between;align-items:flex-start;transition:opacity .6s ease;}
  #titlebox{pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.75)}
  #titlebox .t{font-size:26px;letter-spacing:.04em;font-weight:600;line-height:1.1}
  #titlebox .s{font-size:11px;letter-spacing:.34em;color:var(--muted);margin-top:4px;text-transform:uppercase}
  #titlebox .clock{font-size:13px;color:var(--accent);margin-top:8px;letter-spacing:.14em;
    font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.85)}
  #titlebox .m{font-size:12.5px;color:var(--muted);margin-top:7px;max-width:60vw;line-height:1.5;
    text-shadow:0 1px 12px rgba(0,0,0,.85)}
  .btns{display:flex;gap:10px}
  .ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-border);
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ui);
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;
    box-shadow:0 8px 24px -10px rgba(0,0,0,.6);transition:transform .15s,box-shadow .3s,background .3s}
  .ic:active{transform:scale(.92)}
  .ic:hover{box-shadow:0 0 0 1px var(--accent),0 0 22px -2px rgba(var(--accent-rgb),.7)}
  .ic.active{box-shadow:0 0 0 1px var(--accent),0 0 26px -2px rgba(var(--accent-rgb),.8)}

  /* 底部停靠区：时间轴 + 控制 + 场景卡 */
  #dock{position:fixed;left:0;right:0;bottom:0;z-index:6;
    padding:10px max(14px,var(--safe-l)) calc(10px + var(--safe-b)) max(14px,var(--safe-r));
    display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0));
    transition:opacity .6s ease;}
  #timeline{display:flex;flex-direction:column;gap:5px}
  #track{position:relative;height:30px;border-radius:14px;overflow:hidden;
    border:1px solid var(--glass-border);background:rgba(0,0,0,.35);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);touch-action:none;cursor:pointer}
  .seg{position:absolute;top:0;bottom:0;opacity:.92;transition:opacity .2s}
  .seg:hover{opacity:1}
  .seg.active{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
  #indicator{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;
    box-shadow:0 0 10px 2px rgba(255,255,255,.85);transform:translateX(-1px);left:0;pointer-events:none;z-index:3}
  #indicator::after{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);
    width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 12px 2px rgba(255,255,255,.9)}
  #tl-label{font-size:10.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;
    display:flex;justify-content:space-between}

  #ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .demo{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:30px;
    border:1px solid var(--glass-border);background:var(--glass);color:var(--ui);
    font-size:13px;letter-spacing:.1em;cursor:pointer;backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);box-shadow:0 6px 18px -10px rgba(0,0,0,.7);white-space:nowrap}
  .demo.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px -3px rgba(var(--accent-rgb),.7)}
  .demo:active{transform:scale(.96)}
  .vol{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
  .vol input[type=range]{width:92px;accent-color:var(--accent);height:22px}

  #rail{display:flex;gap:11px;justify-content:center;padding:0}
  .chip{position:relative;width:74px;height:50px;border-radius:13px;overflow:hidden;cursor:pointer;
    border:1px solid var(--glass-border);background:var(--glass);flex:0 0 auto;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 28px -14px rgba(0,0,0,.7);
    transition:transform .22s,border-color .3s,box-shadow .3s}
  .chip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78;transition:opacity .3s}
  .chip .lab{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;text-align:center;
    padding:3px 0;background:linear-gradient(transparent,rgba(0,0,0,.82));letter-spacing:.12em}
  .chip:active{transform:scale(.95)}
  .chip.active{border-color:var(--accent);transform:translateY(-4px);
    box-shadow:0 0 0 1px var(--accent),0 10px 30px -10px rgba(var(--accent-rgb),.75)}
  .chip.active img{opacity:1}

  /* 开场遮罩（轻量，自动淡出，不挡视频） */
  #gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.32);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    transition:opacity .9s ease;text-align:center;padding:24px}
  #gate .card{max-width:420px;width:100%;background:var(--glass-strong);
    border:1px solid var(--glass-border);border-radius:26px;padding:36px 32px;text-align:center;
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  #gate .card::before{content:"";position:absolute;inset:-2px;z-index:-1;border-radius:28px;
    background:linear-gradient(120deg,rgba(var(--accent-rgb),.55),rgba(var(--accent-rgb),.08));
    filter:blur(16px);opacity:.5;animation:pulse 4s ease-in-out infinite}
  #gate h1{font-size:32px;letter-spacing:.18em;font-weight:600}
  #gate .en{font-size:12px;letter-spacing:.42em;color:var(--muted);margin-top:8px;text-transform:uppercase}
  #gate p{font-size:13px;color:var(--muted);letter-spacing:.05em;line-height:1.9;margin-top:18px}
  #gate .go{margin-top:24px;display:inline-block;padding:13px 36px;border-radius:40px;
    border:1px solid var(--glass-border);background:rgba(255,255,255,.05);font-size:14px;
    letter-spacing:.24em;cursor:pointer;color:var(--ui);transition:transform .15s,box-shadow .3s}
  #gate .go:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--accent),0 0 30px -4px rgba(var(--accent-rgb),.8)}
  #gate .go:active{transform:scale(.96)}

  #moodPanel{position:fixed;z-index:40;right:max(16px,var(--safe-r));top:max(70px,calc(var(--safe-t) + 56px));
    width:212px;background:var(--glass-strong);border:1px solid var(--glass-border);
    border-radius:18px;padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);display:none;flex-direction:column;gap:10px}
  #moodPanel.show{display:flex;animation:rise .25s ease}
  #moodPanel .mp-t{font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
  .mood-opt{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;cursor:pointer;
    border:1px solid transparent;transition:background .25s,border-color .25s}
  .mood-opt:hover{background:rgba(255,255,255,.05)}
  .mood-opt.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.1)}
  .mood-opt .sw{width:26px;height:26px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 14px -2px currentColor}
  .mood-opt .nm{font-size:13.5px;letter-spacing:.06em}
  .mood-opt .ds{font-size:11px;color:var(--muted);margin-top:1px}

  #credits{position:fixed;inset:0;z-index:30;background:rgba(6,8,7,.9);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);display:none;flex-direction:column;padding:max(30px,var(--safe-t)) 22px max(30px,var(--safe-b));overflow:auto}
  #credits.show{display:flex;animation:fade .3s ease}
  #credits h2{font-size:18px;letter-spacing:.16em;margin-bottom:20px}
  #credits .row{margin-bottom:16px;border-left:2px solid var(--accent);padding-left:13px}
  #credits .row b{font-size:14px;letter-spacing:.08em}
  #credits .row div{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.75}
  #credits .close{margin-top:auto;align-self:flex-end;padding:11px 28px;border-radius:30px;
    border:1px solid var(--glass-border);background:transparent;color:var(--ui);font-size:13px;cursor:pointer;letter-spacing:.16em}

  .hidden{opacity:0!important;pointer-events:none!important}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.85}}
</style>
</head>
<body data-mood="mist">

  <canvas id="bgCanvas"></canvas>
  <div id="stage">
    <video id="v1" class="vid" muted loop playsinline preload="auto"></video>
    <video id="v2" class="vid" muted loop playsinline preload="auto"></video>
  </div>
  <div id="vignette"></div>
  <div id="scrim"></div>
  <div id="cg"></div>

  <div id="top">
    <div id="titlebox">
      <div class="t serif" id="t-title">静谧自然</div>
      <div class="s" id="t-sub">QUIET NATURE</div>
      <div class="clock" id="clock">--:-- · --</div>
      <div class="m" id="t-mood"></div>
    </div>
    <div class="btns">
      <div class="ic" id="btn-sound" title="声音">🔊</div>
      <div class="ic" id="btn-mood" title="心境">🎨</div>
      <div class="ic" id="btn-info" title="素材来源">ⓘ</div>
    </div>
  </div>

  <div id="dock">
    <div id="timeline">
      <div id="track"><div id="indicator"></div></div>
      <div id="tl-label"><span>00 深夜</span><span>06 清晨</span><span>12 正午</span><span>18 黄昏</span><span>24</span></div>
    </div>
    <div id="ctrl">
      <div class="demo" id="btn-demo">▶ 时光流转</div>
      <div class="vol"><span>🔈</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.85"/></div>
    </div>
    <div id="rail"></div>
  </div>

  <div id="moodPanel">
    <div class="mp-t">心境 · Mood</div>
    <div class="mood-opt" data-mood="mist">
      <span class="sw" style="background:#9fd3c7;color:#9fd3c7"></span>
      <div><div class="nm">晨雾</div><div class="ds">清透 · 青绿</div></div>
    </div>
    <div class="mood-opt" data-mood="ember">
      <span class="sw" style="background:#ffb877;color:#ffb877"></span>
      <div><div class="nm">暖篝</div><div class="ds">温润 · 暖橙</div></div>
    </div>
    <div class="mood-opt" data-mood="night">
      <span class="sw" style="background:#a9b8ff;color:#a9b8ff"></span>
      <div><div class="nm">夜寂</div><div class="ds">沉静 · 月蓝</div></div>
    </div>
  </div>

  <div id="gate">
    <div class="card">
      <h1 class="serif">静谧自然</h1>
      <div class="en">Quiet Nature</div>
      <p>四段真实自然 · 雨 · 森林 · 篝火 · 星空<br/>随一天的光景流转，戴上耳机轻触开始</p>
      <div class="go" id="gate-go">轻触开启</div>
    </div>
  </div>

  <div id="credits">
    <h2>素材来源 / 授权（自我审核）</h2>
    <div id="credits-body"></div>
    <button class="close" id="credits-close">关闭</button>
  </div>

<script>
"use strict";
const SCENES_URL = "./scenes.json";
const DEMO_SECONDS = 120;          // “时光流转”：把 24 小时压缩成约 2 分钟循环
let scenes = [], activeLayer = 1, current = null;
let unlocked = false, muted = false, uiTimer = null;
let volume = 0.85;
let mode = "real";                 // "real" | "demo"
let vh = 0;                        // 应用内“时刻”(0-24，浮点)
let lastT = performance.now();

// ---------- 音频引擎 ----------
const Audio = {
  ctx:null, master:null, comp:null, nodes:new Map(),
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    this.ctx = new AC();
    this.comp = this.ctx.createDynamicsCompressor();
    this.master = this.ctx.createGain();
    this.master.gain.value = volume;
    this.master.connect(this.comp);
    this.comp.connect(this.ctx.destination);
  },
  get(url){
    if(this.nodes.has(url)) return this.nodes.get(url);
    const el = document.createElement("audio");
    el.src = url; el.loop = true; el.preload = "auto";
    const src = this.ctx.createMediaElementSource(el);
    const g = this.ctx.createGain(); g.gain.value = 0;
    src.connect(g); g.connect(this.master);
    const node = {el, gain:g};
    this.nodes.set(url, node);
    return node;
  },
  apply(scene){
    if(!this.ctx) return;
    scene.audio.forEach(url=>this.get(url));
    const list = scene.audio, n = list.length;
    const target = scene.gain / Math.sqrt(n);
    this.nodes.forEach((node,url)=>{
      const inScene = list.includes(url);
      const to = (inScene && !muted) ? target : 0;
      node.gain.gain.cancelScheduledValues(this.ctx.currentTime);
      node.gain.gain.setTargetAtTime(to, this.ctx.currentTime, 0.6);
      if(inScene){ node.el.play().catch(()=>{}); }
    });
  },
  setMuted(m){
    muted = m;
    if(!this.ctx) return;
    const scene = scenes.find(s=>s.id===current);
    if(!scene) return;
    const n = scene.audio.length;
    this.nodes.forEach((node,url)=>{
      const inScene = scene.audio.includes(url);
      const target = (inScene && !m) ? (scene.gain/Math.sqrt(n)) : 0;
      node.gain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.4);
    });
  },
  setVolume(v){
    volume = v;
    if(this.ctx) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.2);
  }
};

// ---------- 视频播放（健壮自动播放）----------
function playVideo(v){
  v.muted = true;
  const p = v.play();
  if(p && p.then){
    p.then(()=>{}).catch(()=>{
      const retry = ()=>{ const q=v.play(); if(q&&q.catch) q.catch(()=>{}); };
      window.addEventListener("pointerdown", retry, {once:true});
    });
  }
}

// ---------- 场景切换（双层交叉淡入）----------
function selectScene(id, instant){
  const sc = scenes.find(s=>s.id===id); if(!sc) return;
  current = id;
  const next = activeLayer===1 ? 2 : 1;
  const vNext = next===1 ? document.getElementById("v1") : document.getElementById("v2");
  const vCur  = activeLayer===1 ? document.getElementById("v1") : document.getElementById("v2");
  vNext.poster = sc.poster;
  vNext.src = sc.video;
  vNext.load();
  const swap = ()=>{
    playVideo(vNext);
    vNext.classList.add("on");
    vCur.classList.remove("on");
    activeLayer = next;
  };
  if(instant){ swap(); }
  else {
    vNext.addEventListener("canplay", swap, {once:true});
    setTimeout(()=>{ if(activeLayer!==next) swap(); }, 1200);
  }
  document.getElementById("t-title").textContent = sc.title + " · " + sc.subtitle;
  document.getElementById("t-sub").textContent = sc.subtitle.toUpperCase();
  document.getElementById("t-mood").textContent = sc.mood;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active", c.dataset.id===id));
  document.querySelectorAll(".seg").forEach(s=>s.classList.toggle("active", s.dataset.id===id));
  if(unlocked) Audio.apply(sc);
}

// ---------- 24 小时时间逻辑 ----------
function sceneAtHour(h){
  for(const s of scenes){
    const {from,to}=s.slot;
    if(from<to){ if(h>=from && h<to) return s; }
    else { if(h>=from || h<to) return s; }   // 跨午夜
  }
  return scenes[0];
}
function periodLabel(h){
  if(h>=5 && h<8)  return "清晨";
  if(h>=8 && h<11) return "上午";
  if(h>=11&&h<13) return "正午";
  if(h>=13&&h<17) return "午后";
  if(h>=17&&h<19) return "黄昏";
  if(h>=19&&h<21) return "傍晚";
  return "深夜";
}
function realHour(){ const d=new Date(); return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600; }
function fmtClock(h){
  const hh = Math.floor(h)%24, mm = Math.floor((h-Math.floor(h))*60);
  return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+" · "+periodLabel(h);
}
function updateClock(){ document.getElementById("clock").textContent = fmtClock(vh); }
function updateIndicator(){ document.getElementById("indicator").style.left = (vh/24*100)+"%"; }
function setVirtualHour(h){
  vh = ((h%24)+24)%24;
  const sc = sceneAtHour(vh);
  if(sc.id!==current) selectScene(sc.id);
  updateClock(); updateIndicator();
}

// ---------- 时间轴构建 + 拖动 ----------
function buildTimeline(){
  const track = document.getElementById("track");
  track.querySelectorAll(".seg").forEach(e=>e.remove());
  const segs=[];
  scenes.forEach(s=>{
    const {from,to}=s.slot;
    if(from<to){ segs.push({s,from,to}); }
    else { segs.push({s,from,to:24}); segs.push({s,from:0,to}); }
  });
  segs.forEach(seg=>{
    const d=document.createElement("div");
    d.className="seg";
    d.style.left=(seg.from/24*100)+"%";
    d.style.width=((seg.to-seg.from)/24*100)+"%";
    d.style.background="linear-gradient(180deg,"+seg.s.accent+"cc,"+seg.s.accent+"55)";
    d.dataset.id=seg.s.id;
    d.title=seg.s.title;
    d.addEventListener("click",e=>{ e.stopPropagation(); jumpToScene(seg.s.id); });
    track.appendChild(d);
  });
}
function hourFromX(clientX){
  const r=document.getElementById("track").getBoundingClientRect();
  let x=(clientX-r.left)/r.width; x=Math.max(0,Math.min(1,x));
  return x*24;
}
function jumpToScene(id){
  setDemo(false);
  const s=scenes.find(x=>x.id===id); if(!s) return;
  const {from,to}=s.slot;
  const mid = from<to ? (from+to)/2 : ((from+(to+24))/2)%24;
  setVirtualHour(mid);
}
let dragging=false;
function initTimelineDrag(){
  const track=document.getElementById("track");
  track.addEventListener("pointerdown",e=>{
    dragging=true; setDemo(false);
    track.setPointerCapture(e.pointerId);
    setVirtualHour(hourFromX(e.clientX)); poke();
  });
  track.addEventListener("pointermove",e=>{ if(dragging) setVirtualHour(hourFromX(e.clientX)); });
  const end=()=>{ dragging=false; };
  track.addEventListener("pointerup",end);
  track.addEventListener("pointercancel",end);
}

// ---------- 时光流转（demo 循环）----------
function setDemo(on){
  mode = on ? "demo" : "real";
  const b=document.getElementById("btn-demo");
  b.classList.toggle("active", on);
  b.textContent = on ? "⏸ 暂停流转" : "▶ 时光流转";
  if(!on){ setVirtualHour(realHour()); }   // 退出演示 → 回到真实时刻
}
function initDemo(){
  document.getElementById("btn-demo").addEventListener("click",e=>{
    e.stopPropagation(); poke();
    setDemo(mode!=="demo");
  });
}

// ---------- 主循环：real 跟随真时 / demo 压缩流转 ----------
function loop(now){
  const dt=(now-lastT)/1000; lastT=now;
  if(mode==="demo"){
    vh = (vh + dt*(24/DEMO_SECONDS)) % 24;
    const sc = sceneAtHour(vh);
    if(sc.id!==current) selectScene(sc.id);
    updateIndicator(); updateClock();
  } else {
    const rh = realHour();
    if(Math.abs(rh-vh) > 0.01){
      vh = rh;
      const sc = sceneAtHour(vh);
      if(sc.id!==current) selectScene(sc.id);
      updateIndicator(); updateClock();
    }
  }
  requestAnimationFrame(loop);
}

// ---------- 解锁音频 ----------
function unlock(){
  if(unlocked) return;
  unlocked = true;
  Audio.ensure();
  Audio.ctx.resume();
  if(current) Audio.apply(scenes.find(s=>s.id===current));
  const gate = document.getElementById("gate");
  gate.classList.add("hidden");
  setTimeout(()=>gate.style.display="none", 900);
}

// ---------- UI 自动隐藏 ----------
function poke(){
  document.getElementById("top").classList.remove("hidden");
  document.getElementById("dock").classList.remove("hidden");
  clearTimeout(uiTimer);
  uiTimer = setTimeout(()=>{
    const cr=document.getElementById("credits"), mp=document.getElementById("moodPanel");
    if(!cr.classList.contains("show") && !mp.classList.contains("show")){
      document.getElementById("top").classList.add("hidden");
      document.getElementById("dock").classList.add("hidden");
    }
  }, 4200);
}

// ---------- 有机漂浮微粒 ----------
function startMotes(){
  const cv=document.getElementById("bgCanvas"), ctx=cv.getContext("2d");
  let motes=[];
  function build(){
    cv.width=innerWidth; cv.height=innerHeight;
    const n=innerWidth<900?44:88;
    motes=Array.from({length:n},()=>({
      x:Math.random()*cv.width, y:Math.random()*cv.height,
      r:Math.random()*2.2+0.7, a:Math.random()*Math.PI*2,
      vx:(Math.random()-0.5)*0.18, vy:-(Math.random()*0.28+0.05),
      tw:Math.random()*0.018+0.005
    }));
  }
  build();
  function moteColor(){ return getComputedStyle(document.body).getPropertyValue("--mote").trim()||"159,211,199"; }
  function frame(){
    if(cv.width!==innerWidth||cv.height!==innerHeight) build();
    ctx.clearRect(0,0,cv.width,cv.height);
    const c=moteColor();
    ctx.globalCompositeOperation="lighter";
    for(const m of motes){
      m.a+=m.tw;
      const al=0.10+Math.abs(Math.sin(m.a))*0.5;
      m.x+=Math.sin(m.a*0.5)*0.22+m.vx; m.y+=m.vy;
      if(m.y<-12){ m.y=cv.height+12; m.x=Math.random()*cv.width; }
      if(m.x<-12) m.x=cv.width+12;
      if(m.x>cv.width+12) m.x=-12;
      const rad=m.r*4.2, g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,rad);
      g.addColorStop(0,"rgba("+c+","+al+")"); g.addColorStop(1,"rgba("+c+",0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(m.x,m.y,rad,0,7); ctx.fill();
    }
    ctx.globalCompositeOperation="source-over";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ---------- 指针辉光 ----------
function initCursorGlow(){
  if(!matchMedia("(pointer:fine)").matches) return;
  const cg=document.getElementById("cg");
  window.addEventListener("pointermove",e=>{
    cg.style.transform="translate("+e.clientX+"px,"+e.clientY+"px)";
    cg.style.opacity=1;
  },{passive:true});
  window.addEventListener("pointerleave",()=>{ cg.style.opacity=0; });
}

// ---------- 心境切换 ----------
function initMood(){
  const saved=localStorage.getItem("cn-mood");
  if(saved) document.body.dataset.mood=saved;
  const panel=document.getElementById("moodPanel");
  function sync(){ document.querySelectorAll(".mood-opt").forEach(o=>o.classList.toggle("active",o.dataset.mood===document.body.dataset.mood)); }
  sync();
  document.getElementById("btn-mood").addEventListener("click",e=>{
    e.stopPropagation(); poke(); panel.classList.toggle("show"); sync();
  });
  document.querySelectorAll(".mood-opt").forEach(o=>{
    o.addEventListener("click",e=>{
      e.stopPropagation();
      document.body.dataset.mood=o.dataset.mood;
      localStorage.setItem("cn-mood",o.dataset.mood);
      sync(); panel.classList.remove("show");
    });
  });
  document.addEventListener("click",()=>panel.classList.remove("show"));
}

// ---------- 授权面板 ----------
function buildCredits(){
  document.getElementById("credits-body").innerHTML = scenes.map(s=>`
    <div class="row"><b>${s.title} · ${s.subtitle}</b>
      <div>视频：${s.credit.video}</div>
      <div>音频：${s.credit.audio}</div>
      <div>封面：${s.credit.poster}</div>
    </div>`).join("") +
    `<div class="row"><b>说明</b>
      <div>视频与部分环境音来自 Pixabay / 开源 beach-wallpaper 项目，均可在个人与商业项目中免费使用、无需署名（Pixabay License / 开源免费协议）。雨声来自 Pixabay（nils_vega）。本页仅做沉浸式播放，未改写原始素材内容。</div>
    </div>`;
}

// ---------- 启动 ----------
fetch(SCENES_URL).then(r=>r.json()).then(data=>{
  scenes=data;
  const rail=document.getElementById("rail");
  scenes.forEach(s=>{
    const c=document.createElement("div");
    c.className="chip"; c.dataset.id=s.id;
    c.innerHTML=`<img src="${s.poster}" alt="${s.title}"/><div class="lab">${s.title}</div>`;
    c.addEventListener("click",()=>{ poke(); jumpToScene(s.id); });
    rail.appendChild(c);
  });
  buildCredits();
  buildTimeline();
  initTimelineDrag();
  initDemo();
  vh=realHour();
  selectScene(sceneAtHour(vh).id, true);   // 默认按当前真实时刻选景
  updateClock(); updateIndicator();
  poke();
  startMotes();
  initCursorGlow();
  initMood();
  requestAnimationFrame(loop);
  // 开场遮罩：4 秒后自动淡出（视频已在背后播放）
  setTimeout(()=>{
    const g=document.getElementById("gate");
    if(!g.classList.contains("hidden")){ g.classList.add("hidden"); setTimeout(()=>g.style.display="none",900); }
  }, 4000);
}).catch(e=>{ console.error(e); });

document.getElementById("gate-go").addEventListener("click", unlock);
document.getElementById("stage").addEventListener("click",()=>{ if(!unlocked) unlock(); else poke(); });
document.getElementById("btn-sound").addEventListener("click",e=>{
  e.stopPropagation(); poke();
  muted=!muted;
  const b=document.getElementById("btn-sound");
  b.textContent=muted?"🔇":"🔊";
  b.classList.toggle("active",!muted);
  if(unlocked) Audio.setMuted(muted);
});
document.getElementById("btn-info").addEventListener("click",e=>{
  e.stopPropagation(); poke();
  document.getElementById("credits").classList.add("show");
});
document.getElementById("credits-close").addEventListener("click",e=>{
  e.stopPropagation();
  document.getElementById("credits").classList.remove("show");
});
document.getElementById("vol").addEventListener("input",e=>{
  poke();
  Audio.setVolume(parseFloat(e.target.value));
});
["pointermove","touchstart","keydown"].forEach(ev=>window.addEventListener(ev,poke,{passive:true}));
window.addEventListener("orientationchange",()=>setTimeout(()=>window.scrollTo(0,0),200));
window.addEventListener("resize",()=>window.scrollTo(0,0));
</script>
